<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شبکه‌های من</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style>
:root{--bg:#0e1116;--card:#1a1f29;--tx:#eef1f6;--mut:#8b94a5;--ac:#3b9cff;--err:#ff5c5c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,Tahoma,sans-serif}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#player{position:relative;background:#000;aspect-ratio:16/9;width:100%;flex:none}
video{width:100%;height:100%;background:#000}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;color:var(--mut);pointer-events:none;font-size:15px}
#msg.err{color:var(--err)}
#now{padding:10px 14px;font-weight:bold;display:flex;justify-content:space-between;align-items:center;gap:8px}
#now button{background:var(--card);color:var(--tx);border:0;border-radius:8px;padding:8px 12px;font-size:14px}
#tools{display:flex;gap:8px;padding:0 12px 8px}
#q{flex:1;background:var(--card);border:0;border-radius:10px;padding:11px 12px;color:var(--tx);font-size:15px}
#add{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:0 16px;font-size:22px}
#list{flex:1;overflow-y:auto;padding:0 12px 12px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;align-content:start}
.ch{background:var(--card);border-radius:12px;padding:14px 10px;text-align:center;font-size:15px;position:relative;border:2px solid transparent}
.ch.on{border-color:var(--ac)}
.ch small{display:block;color:var(--mut);font-size:11px;margin-top:4px}
.ch .del{position:absolute;top:4px;left:6px;color:var(--err);font-size:16px;padding:2px 6px}
dialog{background:var(--card);color:var(--tx);border:0;border-radius:14px;width:88%;max-width:420px}
dialog input{width:100%;margin:6px 0;background:var(--bg);border:0;border-radius:8px;padding:11px;color:var(--tx);font-size:15px;direction:ltr}
dialog .row{display:flex;gap:8px;margin-top:8px}
dialog button{flex:1;border:0;border-radius:8px;padding:11px;font-size:15px;background:var(--bg);color:var(--tx)}
dialog button.ok{background:var(--ac);color:#fff}
::backdrop{background:rgba(0,0,0,.6)}
</style>
</head>
<body>
<div id="player"><video id="v" controls playsinline autoplay></video><iframe id="yt" allow="autoplay; fullscreen; encrypted-media" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" style="display:none;width:100%;height:100%;border:0;position:absolute;inset:0"></iframe><div id="msg">یه شبکه انتخاب کن</div></div>
<div id="now"><span id="nm">—</span><button id="fs">تمام‌صفحه</button></div>
<div id="tools"><input id="q" placeholder="جستجوی شبکه..."><button id="add">+</button></div>
<div id="list"></div>

<dialog id="dlg">
  <b>افزودن شبکه</b>
  <input id="an" placeholder="نام شبکه" style="direction:rtl">
  <input id="au" placeholder="لینک m3u8 یا یوتیوب (https://...)">
  <div class="row"><button id="cancel">انصراف</button><button class="ok" id="save">ذخیره</button></div>
</dialog>

<script>
// شبکه‌های پیش‌فرض (لینک‌های رسمی؛ اگه یکی کار نکرد از + عوضش کن)
const DEFAULTS=[
 {n:"Al Jazeera English",c:"خبری",u:"https://live-hls-web-aje.getaj.net/AJE/index.m3u8"},
 {n:"DW English",c:"خبری",u:"https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/index.m3u8"},
 {n:"France 24 English",c:"خبری",u:"https://static.france24.com/live/F24_EN_HI_HLS/live_web.m3u8"}
];
const KEY="my_channels_v1";
let custom=[];try{custom=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){}
let cur=null,hls=null;
const $=id=>document.getElementById(id),v=$("v");

function all(){return DEFAULTS.concat(custom.map(x=>({...x,c:"من",custom:1})))}
function render(){
  const f=$("q").value.trim().toLowerCase(),box=$("list");box.innerHTML="";
  all().forEach(ch=>{
    if(f&&!ch.n.toLowerCase().includes(f))return;
    const d=document.createElement("div");d.className="ch"+(cur&&cur.u===ch.u?" on":"");
    d.innerHTML=ch.n+"<small>"+ch.c+"</small>";
    if(ch.custom){const x=document.createElement("span");x.className="del";x.textContent="✕";
      x.onclick=e=>{e.stopPropagation();custom=custom.filter(c=>c.u!==ch.u);persist();render()};d.appendChild(x)}
    d.onclick=()=>play(ch);box.appendChild(d);
  });
}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(custom))}catch(e){}}
function say(t,err){const m=$("msg");m.textContent=t;m.className=err?"err":"";m.style.display=t?"flex":"none"}
function ytEmbed(u){
  let m=u.match(/youtube\.com\/channel\/(UC[\w-]{22})/);
  if(m)return"https://www.youtube.com/embed/live_stream?channel="+m[1]+"&autoplay=1&playsinline=1";
  m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|live\/|embed\/))([\w-]{11})/);
  if(m)return"https://www.youtube.com/embed/"+m[1]+"?autoplay=1&playsinline=1";
  return null;
}
function play(ch){
  cur=ch;$("nm").textContent=ch.n;render();
  const y=ytEmbed(ch.u),f=$("yt");
  if(hls){hls.destroy();hls=null}
  v.pause();
  if(y){v.style.display="none";f.style.display="block";f.src=y;say("");return}
  f.style.display="none";f.src="about:blank";v.style.display="block";say("در حال بارگذاری...");
  if(window.Hls&&Hls.isSupported()){
    hls=new Hls({maxBufferLength:20});
    hls.loadSource(ch.u);hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>v.play().catch(()=>{}));
    hls.on(Hls.Events.ERROR,(e,d)=>{
      if(!d.fatal)return;
      if(d.type===Hls.ErrorTypes.NETWORK_ERROR){say("خطای شبکه؛ تلاش مجدد...",1);setTimeout(()=>hls&&hls.startLoad(),2000)}
      else if(d.type===Hls.ErrorTypes.MEDIA_ERROR){hls.recoverMediaError()}
      else{say("این شبکه پخش نشد (لینک خراب یا محدود)",1)}
    });
  }else{v.src=ch.u;v.play().catch(()=>{})}
}
v.addEventListener("playing",()=>say(""));
v.addEventListener("waiting",()=>{if(cur)say("در حال بارگذاری...")});
$("q").oninput=render;
$("fs").onclick=()=>{const p=$("player");(p.requestFullscreen||p.webkitRequestFullscreen||(()=>v.webkitEnterFullscreen&&v.webkitEnterFullscreen())).call(p)};
$("add").onclick=()=>{$("an").value="";$("au").value="";$("dlg").showModal()};
$("cancel").onclick=()=>$("dlg").close();
$("save").onclick=()=>{
  const n=$("an").value.trim(),u=$("au").value.trim();
  if(!n||!/^https?:\/\//.test(u))return;
  custom.push({n,u});persist();$("dlg").close();render();
};
render();
</script>
</body>
</html>
